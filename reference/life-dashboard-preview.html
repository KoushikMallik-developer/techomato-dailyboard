<title>Life Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone column (max 440px). Navy hero panel with life score on top of a slate page; white cards; sticky tab bar with a centre quick-add button; bottom sheet for every add/edit form.
   Palette and type follow the Techomato Colleges brand guide: royal blue #315bea, navy panels, slate page, Inter, 12-16px radii. */
:root {
  --bg: #f5f2ec; --card: #ffffff; --soft: #efeae1; --ink: #17181c; --muted: #5b5f6a; --line: #e4dfd5;
  --brand: #c8381f; --brand-ink: #ffffff; --brand-soft: #fbe6e0; --brand-deep: #8e2413;
  --ok: #047857; --ok-soft: #ecfdf5; --warn: #92400e; --warn-soft: #fffbeb; --bad: #be123c; --bad-soft: #fff1f2;
  --panel: #17181c; --panel-2: #22242a; --panel-text: #9ca0ab; --panel-strong: #e7e8ec; --panel-line: #2a2c33;
  --scrim: rgba(10, 17, 30, .55); --ring: #ec6850;
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 15px; --fs-lg: 17px; --fs-xl: 20px; --fs-2xl: 26px; --fs-3xl: 32px; --fs-display: 56px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --r-xs: 6px; --r-pill: 999px; --hit: 44px; --white: #fff;
  --f: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141417; --card: #1c1d22; --soft: #25272d; --ink: #f1efea; --muted: #a3a6af; --line: #2c2e35;
    --brand-soft: #3a1e18; --brand-deep: #ec6850; --ok: #6ee7b7; --ok-soft: #12302a; --warn: #fcd34d; --warn-soft: #33290f; --bad: #fda4af; --bad-soft: #3a1821;
    --panel: #0f1013; --panel-2: #1a1b20; --panel-text: #a3a6af; --panel-strong: #f1efea; --panel-line: #26282e; --ring: #ec6850; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141417; --card: #1c1d22; --soft: #25272d; --ink: #f1efea; --muted: #a3a6af; --line: #2c2e35;
  --brand-soft: #3a1e18; --brand-deep: #ec6850; --ok: #6ee7b7; --ok-soft: #12302a; --warn: #fcd34d; --warn-soft: #33290f; --bad: #fda4af; --bad-soft: #3a1821;
  --panel: #0f1013; --panel-2: #1a1b20; --panel-text: #a3a6af; --panel-strong: #f1efea; --panel-line: #26282e; --ring: #ec6850; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: var(--fs-md); line-height: 1.45; letter-spacing: -.005em;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
* { box-sizing: border-box; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.app { max-width: 440px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; padding-block: 14px 6px; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
.tile { width: 30px; height: 30px; border-radius: var(--r-sm); background: var(--brand); display: grid; place-items: center; }
.tile svg { width: 18px; height: 18px; stroke: var(--brand-ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ibtn { width: 36px; height: 36px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; }
.ibtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ptitle { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); margin-top: var(--s-1); }
h1 { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -.03em; line-height: 1.15; margin: 0; text-wrap: balance; }
.back { font-size: var(--fs-md); font-weight: 600; color: var(--brand-deep); display: inline-block; padding: 6px 0 2px; }
main { flex: 1; display: flex; flex-direction: column; gap: var(--s-3); padding-block: 12px 100px; }
/* hero */
.hero { background: var(--panel); color: var(--panel-strong); border-radius: var(--r-lg); padding: 18px; display: grid; gap: var(--s-4); }
.hero .hi { font-size: var(--fs-md); color: var(--panel-text); }
.hero h2 { margin: 2px 0 0; font-size: var(--fs-xl); font-weight: 700; letter-spacing: -.02em; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 84px; height: 84px; transform: rotate(-90deg); }
.ring .tr { stroke: var(--panel-line); } .ring .fg { stroke: var(--ring); stroke-linecap: round; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: var(--fs-xl); font-weight: 700; letter-spacing: -.03em; }
.ring small { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: var(--fs-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--panel-text); }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
.hs { background: var(--panel-2); border-radius: var(--r-md); padding: 10px 12px; min-width: 0; }
.hs b { display: block; font-size: var(--fs-lg); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.hs span { font-size: var(--fs-xs); color: var(--panel-text); }
/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-4); min-width: 0; }
.card h2 { font-size: var(--fs-base); font-weight: 600; letter-spacing: -.015em; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); }
.card h2 a { display: flex; align-items: center; gap: var(--s-2); min-width: 0; }
.card h2 .chev { color: var(--brand-deep); }
.card h2 small, .muted { font-size: var(--fs-sm); font-weight: 400; color: var(--muted); letter-spacing: 0; }
.ic { width: 28px; height: 28px; border-radius: 8px; background: var(--brand-soft); color: var(--brand-deep); display: grid; place-items: center; flex: none; }
.ic svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
h3 { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.row { display: flex; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; align-items: end; }
.big { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s-3); min-width: 0; }
.stat .big { font-size: var(--fs-xl); overflow-wrap: anywhere; }
.stat .muted { font-size: var(--fs-xs); display: block; }
.empty { color: var(--muted); font-size: var(--fs-md); padding: 4px 0; }
.note { font-size: var(--fs-sm); color: var(--muted); margin: 0; }
.more { font-size: var(--fs-sm); font-weight: 600; color: var(--brand-deep); display: inline-block; margin-top: var(--s-2); }
/* buttons and fields */
.btn { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: var(--r-md); padding: 10px 16px; font-weight: 600; }
.btn.sm { padding: 7px 12px; font-size: var(--fs-md); border-radius: var(--r-sm); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--bad); color: var(--card); }
.btn.block { width: 100%; }
.lnk { background: none; border: 0; color: var(--muted); font-size: var(--fs-sm); padding: 4px 6px; border-radius: var(--r-xs); }
.field, form input:not([type=checkbox]), form select, form textarea { width: 100%; background: var(--soft); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; }
textarea { resize: vertical; min-height: 84px; }
label.f { display: grid; gap: var(--s-1); font-size: var(--fs-sm); font-weight: 500; color: var(--muted); }
.inline { display: flex; gap: var(--s-2); }
.inline .btn { flex: none; }
.seg { display: flex; background: var(--soft); border: 1px solid var(--line); border-radius: var(--r-md); padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: var(--r-sm); padding: 7px 4px; color: var(--muted); font-weight: 500; font-size: var(--fs-md); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: var(--r-pill); padding: 4px 11px; font-size: var(--fs-sm); color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.ntitle { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -.03em; margin: 6px 0 10px; }
.ngrp { font-size: var(--fs-md); font-weight: 600; color: var(--muted); margin: 16px 4px 6px; }
.nrow { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; font: inherit; color: var(--ink); }
.nrow:first-child { border-top: 0; }
.nrow b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.nrow span { display: block; color: var(--muted); font-size: var(--fs-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nbar { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); margin-bottom: 6px; }
.nbar .r { display: flex; gap: var(--s-4); align-items: center; }
input.nin { width: 100%; border: 0; background: none; color: var(--ink); font: inherit; font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -.02em; padding: 6px 0; outline: none; }
textarea.nbody { width: 100%; border: 0; background: none; color: var(--ink); font: inherit; line-height: 1.5; resize: none; outline: none; padding: 4px 0; }
.nmeta { text-align: center; color: var(--muted); font-size: var(--fs-sm); margin: 8px 0; }
.nitem { display: flex; align-items: center; gap: var(--s-3); padding: 2px 0; }
.nitem input { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); font: inherit; outline: none; padding: 8px 0; }
.nitem.done input { color: var(--muted); text-decoration: line-through; }
.board { display: flex; gap: var(--s-3); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: var(--s-2); margin-top: var(--s-3); }
.bcol { flex: 0 0 82%; max-width: 320px; scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s-3); }
.bcol h3 { margin: 0 0 6px; }
.bcard { border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px 10px 6px; margin-bottom: var(--s-2); background: var(--soft); }
/* touch targets: grow the hit area to 44px without changing the layout */
.lnk, .chk, .dot, .chip, .btn.sm, .seg button { position: relative; }
.lnk::after, .chk::after, .dot::after, .chip::after, .btn.sm::after, .seg button::after { content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, var(--hit)); height: max(100%, var(--hit)); transform: translate(-50%, -50%); }
.btn, .field, form input:not([type=checkbox]), form select { min-height: var(--hit); }
/* utilities replace repeated inline styles */
.u-mt2 { margin-top: var(--s-2); } .u-mt3 { margin-top: var(--s-3); } .u-mt4 { margin-top: var(--s-4); }
.u-blk { display: block; } .u-mw0 { min-width: 0; } .u-aic { align-items: center; } .u-bgcard { background: var(--card); } .u-fw5 { font-weight: 500; }
.u-ttl { font-weight: 600; font-size: var(--fs-base); overflow-wrap: anywhere; }
.tagp { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: var(--r-xs); padding: 2px 6px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.tagp.h { background: var(--bad-soft); color: var(--bad); } .tagp.m { background: var(--warn-soft); color: var(--warn); } .tagp.ok { background: var(--ok-soft); color: var(--ok); } .tagp.b { background: var(--brand-soft); color: var(--brand-deep); }
.sample { font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; background: var(--warn-soft); color: var(--warn); border-radius: var(--r-xs); padding: 2px 6px; }
/* list rows */
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-of-type { border-top: 0; padding-top: 0; }
.li:last-child { padding-bottom: 0; }
.li > .nm { grid-column: 2; font-weight: 500; overflow-wrap: anywhere; text-align: left; background: none; border: 0; padding: 0; }
.li.two > .nm { grid-column: 1 / 3; }
.li .sub { grid-column: 2 / 4; font-size: var(--fs-sm); color: var(--muted); }
.li.two .sub { grid-column: 1 / 4; }
.li.done .nm { text-decoration: line-through; color: var(--muted); }
.chk { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--muted); background: transparent; padding: 0; color: var(--brand-ink); font-size: var(--fs-md); line-height: 1; }
.li.done .chk, .chk.on { background: var(--brand); border-color: var(--brand); }
.bad { color: var(--bad); font-weight: 600; }
.day { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; display: flex; justify-content: space-between; }
.day:first-child { margin-top: 0; }
.bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
.bar i.over { background: var(--warn); } .bar i.good { background: var(--ok); }
.ex { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); padding: 10px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; font-variant-numeric: tabular-nums; }
.ex:first-of-type { border-top: 0; padding-top: 0; }
.ex .l { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.ex .r { font-weight: 600; flex: none; }
.ex .r.inc { color: var(--ok); }
.cat { display: grid; grid-template-columns: 78px 1fr auto; gap: var(--s-3); align-items: center; font-size: var(--fs-md); padding: 5px 0; font-variant-numeric: tabular-nums; }
/* habits */
.hb { padding: 10px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.hb:first-of-type { border-top: 0; padding-top: 0; }
.dots { display: flex; gap: 5px; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; padding: 0; }
.dot.on { background: var(--brand); border-color: var(--brand); }
.dot.today { outline: 1.5px solid var(--muted); outline-offset: 2px; }
.heat { display: grid; grid-template-columns: repeat(13, 1fr); grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: 3px; margin: 12px 0 6px; }
.hc { aspect-ratio: 1; border: 0; border-radius: 3px; background: var(--soft); padding: 0; min-width: 0; }
.hc.on { background: var(--brand); } .hc.blank { background: transparent; pointer-events: none; }
.hc.today { outline: 1.5px solid var(--ink); outline-offset: 1px; }
.hhead { display: flex; justify-content: space-between; align-items: start; gap: var(--s-2); }
/* charts */
svg.chart { width: 100%; height: auto; display: block; }
.chart .b { fill: var(--brand); } .chart .b.t { fill: var(--ink); } .chart .ax { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font: 10px var(--f); } .chart .ln { stroke: var(--brand); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; } .chart .pt { fill: var(--brand); }
.chart .tg { stroke: var(--ok); stroke-width: 1; stroke-dasharray: 3 3; }
/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--s-1); text-align: center; }
.cal .wd { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; text-transform: uppercase; padding-bottom: 2px; }
.cd { aspect-ratio: 1; border-radius: var(--r-sm); border: 0; background: transparent; padding: 0; display: grid; place-items: center; position: relative; font-variant-numeric: tabular-nums; min-width: 0; }
.cd.has::after { content: ""; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--brand); }
.cd.today { color: var(--brand-deep); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--brand); }
.cd.sel { background: var(--brand); color: var(--brand-ink); } .cd.sel.has::after { background: var(--brand-ink); }
.cd.blank { pointer-events: none; }
/* water, mood */
.water { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.water .step { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); font-size: var(--fs-xl); line-height: 1; padding: 0; }
.water .step.p { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.moods button { border: 1px solid var(--line); background: var(--soft); border-radius: var(--r-sm); padding: 8px 0; font-size: var(--fs-sm); font-weight: 500; }
.moods button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
.hours { display: flex; gap: var(--s-4); overflow-x: auto; padding-bottom: 6px; }
.hours div { text-align: center; font-size: var(--fs-sm); flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
.hours b { display: block; font-size: var(--fs-base); color: var(--ink); }
.fc { display: grid; grid-template-columns: 56px 1fr auto; gap: var(--s-3); padding: 9px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.fc:first-of-type { border-top: 0; padding-top: 0; }
.wx { display: flex; align-items: center; gap: var(--s-4); } .wx .t { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -.04em; } .wx svg { width: 50px; height: 50px; flex: none; }
/* apps grid */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.tilea { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-4); display: grid; gap: var(--s-3); min-width: 0; }
.tilea b { font-size: var(--fs-md); font-weight: 600; display: block; letter-spacing: -.01em; } .tilea span.s { font-size: var(--fs-sm); color: var(--muted); display: block; overflow-wrap: anywhere; }
.tilea.off { opacity: .55; }
/* settings */
.sw { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); padding: 10px 0; border-top: 1px solid var(--line); }
.sw:first-of-type { border-top: 0; padding-top: 0; }
.sw .l { display: flex; align-items: center; gap: var(--s-3); min-width: 0; }
.tg { width: 44px; height: 26px; border-radius: 13px; border: 0; background: var(--line); position: relative; flex: none; padding: 0; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--white); transition: transform .15s; }
.tg[aria-pressed="true"] { background: var(--brand); } .tg[aria-pressed="true"]::after { transform: translateX(18px); }
.mv { display: flex; }
.evdone .l { text-decoration: line-through; color: var(--muted); }
.arow { display: flex; align-items: center; gap: var(--s-3); padding: 10px 0; border-top: 1px solid var(--line); }
.arow:first-of-type { border-top: 0; padding-top: 0; }
.arow:last-child { padding-bottom: 0; }
.ax { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; display: grid; gap: 1px; }
.at { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.arow.off .at { color: var(--muted); }
.dayset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.dayset legend { font-size: var(--fs-sm); font-weight: 500; color: var(--muted); padding: 0; margin-bottom: 6px; }
.dayset label { position: relative; }
.dayset input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
.dayset span { display: block; padding: 7px 11px; border: 1px solid var(--line); border-radius: var(--r-pill); font-size: var(--fs-sm); font-weight: 500; background: var(--soft); }
.dayset input:checked + span { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.dayset input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
.dayset .note { width: 100%; }

let AC = null;

  U.ring.push(item); beep(); renderRing();
  try { if (window.Notification && Notification.permission === "granted") new Notification(item.title, { body: item.kind === "event" ? (item.pre ? "Starts in " + item.pre + " min" : "Starting now") : "Alarm " + item.time }); } catch (e) {}
}
function tick() {
  const now = new Date(), nk = key(now), tmr = key(new Date(now.getTime() + 864e5)), dow = (now.getDay() + 6) % 7;
  let changed = false;
  const once = (k, fn) => { if (S.fired[k]) return; S.fired[k] = nk; changed = true; fn(); };
  S.alarms.forEach((a) => {
    if (!a.on || (a.days.length && !a.days.includes(dow))) return;
    const diff = now - new Date(nk + "T" + a.t + ":00");
    if (diff >= 0 && diff < 120000) once("a" + a.id + nk + a.t, () => { fire({ kind: "alarm", title: a.label || "Alarm", time: a.t, snooze: a.snooze }); if (!a.days.length) a.on = 0; });
  });
  if (S.alerts.on) S.events.forEach((e) => {
    if (!e.time || (e.d !== nk && e.d !== tmr)) return;
    const tk = e.tid ? taskOf(e) : null; if (tk && tk.x) return;
    const start = new Date(e.d + "T" + e.time + ":00"), lead = S.alerts.lead * 60000, base = "e" + e.id + e.d + e.time;
    if (now >= start - lead && now < start) once(base + "p", () => fire({ kind: "event", title: e.t, time: e.time, pre: Math.max(1, Math.ceil((start - now) / 60000)), snooze: 5 }));
    if (now >= start && now - start < 120000) once(base + "n", () => fire({ kind: "event", title: e.t, time: e.time, pre: 0, snooze: 5 }));
  });
  S.snz = S.snz.filter((z) => { if (z.at > now.getTime()) return true; fire(z.item); changed = true; return false; });
  const old = key(ago(3)); Object.keys(S.fired).forEach((k) => { if (S.fired[k] < old) { delete S.fired[k]; changed = true; } });
  if (changed) { if (U.sheet || (U.nview === "edit" && route() === "notes")) { renderRing(); save(); } else render(); } // do not wipe a form that is open
}

  else if (a === "tab") { U.tab[k] = d.v; U.confirm = ""; }

  else if (a === "pback") { U.pview = "list"; }

  else if (a === "pnote") { const p = byId(S.proj, U.pid); if (!S.nfold.includes("Projects")) S.nfold.push("Projects"); const n = { id: S.nid++, t: p.t + " notes", body: "", items: [], lab: "Projects", pin: 0, st: "on", rem: "", m: Date.now(), tr: 0, pid: p.id }; S.notes.unshift(n); U.nfolder = "Projects"; openNote(n.id); }
  else if (a === "pdup") { const p = byId(S.proj, U.pid), c = JSON.parse(JSON.stringify(p)); c.id = S.nid++; c.t = p.t + " (copy)"; c.st = "idea"; c.c = TODAY; c.ups = []; c.time = []; c.ms.forEach((m) => { m.id = S.nid++; m.x = 0; }); c.tasks.forEach((t) => { t.id = S.nid++; t.x = 0; t.f = null; delete t.ptid; }); c.links.forEach((l) => { l.id = S.nid++; }); S.proj.unshift(c); U.pid = c.id; }
  else if (a === "nopen") { U.nfolder = d.v; U.nview = "list"; U.nq = ""; U.confirm = ""; }

  else if (a === "nchk") { const n = byId(S.notes, U.nid); n.items.push({ t: "", x: 0 }); n.m = Date.now(); render(); const el = document.querySelector('[data-ni="' + (n.items.length - 1) + '"]'); if (el) el.focus(); return; }

  else if (a === "wep") { const w = byId(S.watch, id); w.ep = (Number(w.ep) || 0) + 1; if (!w.se) w.se = 1; if (w.st === "todo") w.st = "doing"; }
  else if (a === "wtab") { U.wtab = d.v; }
  else if (a === "wtype") { U.wtype = d.v; U.pick = 0; }

  else if (a === "wstart") { const w = byId(S.watch, id); w.st = "doing"; U.pick = 0; U.wtab = "doing"; }
  else if (a === "wdis") { U.pick = 0; }
  else if (a === "aon") { const al = byId(S.alarms, id); al.on = al.on ? 0 : 1; }
  else if (a === "alon") { S.alerts.on = S.alerts.on ? 0 : 1; }

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target, d = f.dataset, els = f.elements;
  if (d.form === "quick") {
    const v = els.t.value.trim(); if (!v) return;
    if (d.type === "task") S[d.ctx].unshift({ id: S.nid++, t: v, p: "m", due: "", c: TODAY, x: 0, f: null, cal: "", time: "" });
    else if (d.type === "ptask") byId(S.proj, U.pid).tasks.push({ id: S.nid++, t: v, x: 0, p: "m", due: "", f: null });
    else if (d.type === "pup") byId(S.proj, U.pid).ups.push({ d: TODAY, t: v });
    else if (d.type === "nfolder") { if (!S.nfold.includes(v)) S.nfold.push(v); }
    else if (d.type === "watch") S.watch.unshift({ id: S.nid++, t: v, type: els.type.value, plat: "", st: "todo", se: "", ep: "", rate: 0, plan: "", note: "", c: TODAY, f: null });
    else S.shop.push({ id: S.nid++, t: v, q: "", x: 0 });
  } else if (d.form === "profile") { S.name = els.name.value.trim(); S.cur = els.cur.value; }
  else if (d.form === "sheet") {
    const T = TYPES[d.type], v = {};
    for (const fd of T.f()) {
      if (fd.t === "days") { v[fd.n] = Array.from(f.querySelectorAll('input[name="days"]:checked')).map((x) => Number(x.value)); continue; }
      const raw = els[fd.n].value.trim();
      if (fd.t === "num") { v[fd.n] = raw === "" ? (fd.d !== undefined ? fd.d : 0) : parseFloat(raw); if (isNaN(v[fd.n]) || (fd.req && !(v[fd.n] > 0))) { els[fd.n].focus(); return; } }
      else { v[fd.n] = fd.n === "mood" ? Number(raw) : raw; if (fd.req && !raw) { els[fd.n].focus(); return; } }
    }
    if (d.type === "bill") v.day = Math.min(31, Math.max(1, Math.round(v.day)));
    if (d.type === "date") v.rem = Number(v.rem);
    if (d.type === "alarm") v.snooze = Number(v.snooze);
    if (d.type === "watch") v.rate = Number(v.rate);
    if (d.type === "task" && v.cal === "1" && !v.due) v.due = TODAY; // a calendar event needs a date
    let item;
    if (T.custom) T.save(v, d.ctx);
    else {
      if (d.id) { item = byId(T.L(d.ctx), d.id); Object.assign(item, v); } else { item = Object.assign({ id: S.nid++ }, T.def(), v); T.L(d.ctx).unshift(item); }
      if (d.type === "bill") S.spend.forEach((x) => { if (x.bid === item.id && x.d.slice(0, 7) === MONTH) { x.a = v.a; x.l = v.n; } }); // keep the linked payment in step
      if (d.type === "task") syncTaskEvent(item, d.ctx);
      if (d.type === "ptask" && item.ptid) { const pl = byId(S.personal, item.ptid); if (pl) { pl.t = item.t; pl.due = item.due || ""; } }
      if (d.type === "watch") item.f = item.st === "done" ? (item.f || TODAY) : null; // watched date follows the status
      if (d.type === "event" && item.tid) { const tt = taskOf(item); if (tt) { tt.t = item.t; tt.due = item.d; tt.time = item.time; } }
    }
    U.sheet = null; U.confirm = "";
  } else return;
  render();
});
document.addEventListener("keydown", (e) => {
  const t = e.target; if (e.key !== "Enter" || !t.dataset || t.dataset.ni === undefined) return;
  e.preventDefault(); const n = byId(S.notes, U.nid), i = Number(t.dataset.ni), has = t.value.trim();
  if (has) n.items.splice(i + 1, 0, { t: "", x: 0 }); else n.items.splice(i, 1);
  render(); const el = document.querySelector('[data-ni="' + (has ? i + 1 : i) + '"]'); if (el) el.focus();
});
document.addEventListener("input", (e) => {
  const t = e.target; if (t.dataset && (t.dataset.nf || t.dataset.ni !== undefined)) { noteInput(t); return; } if (!t.dataset || !t.dataset.live) return;
  U[t.dataset.live] = t.value;
  if (t.dataset.live === "q") { $("results").innerHTML = searchResults(); return; }
  const pos = t.selectionStart; render();
  const n = $(t.id); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener("change", (e) => {
